<button id="music-toggle" class="music-btn">🔈 Music: Off</button>

<audio id="background-music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
    const music = document.getElementById("background-music");
    const btn = document.getElementById("music-toggle");

    // 1. Function to handle play/pause
    const toggleMusic = () => {
        if (music.paused) {
            music.volume = 0.3;
            music.play().catch(() => {});
            btn.textContent = "🔊 Music: On";
            localStorage.setItem("musicPlaying", "true");
        } else {
            music.pause();
            btn.textContent = "🔈 Music: Off";
            localStorage.setItem("musicPlaying", "false");
        }
    };

    // 2. Add event listener to the button
    btn.addEventListener("click", toggleMusic);

    // 3. Auto-start on first interaction (click anywhere on page)
    const autoStart = () => {
        if (music.paused && localStorage.getItem("musicPlaying") !== "false") {
            music.volume = 0.3;
            music.play().then(() => {
                btn.textContent = "🔊 Music: On";
                localStorage.setItem("musicPlaying", "true");
                document.removeEventListener("click", autoStart);
            }).catch(() => {});
        }
    };

    document.addEventListener("click", autoStart);

    // 4. On page load, check if it was playing previously
    window.addEventListener("load", () => {
        if (localStorage.getItem("musicPlaying") === "true") {
            music.volume = 0.3;
            // Attempt autoplay; if blocked, it will wait for the first click
            music.play().then(() => {
                btn.textContent = "🔊 Music: On";
            }).catch(() => {
                btn.textContent = "🔈 Music: Off";
            });
        }
    });
</script>
