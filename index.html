<div class="cursor-glow"></div>

<script>

const glow = document.querySelector(".cursor-glow");

document.addEventListener("mousemove", (e) => {

    glow.style.left = e.clientX + "px";
    glow.style.top = e.clientY + "px";

});

</script>

<audio id="background-music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
    const music = document.getElementById("background-music");

    // This function attempts to play the music once the user interacts with the page
    const startAudio = () => {
        music.volume = 0.3;
        music.play().then(() => {
            // Audio started successfully!
            // Remove the event listener so it doesn't trigger again
            document.removeEventListener("click", startAudio);
            document.removeEventListener("keydown", startAudio);
        }).catch(error => {
            console.log("Interaction required to play audio.");
        });
    };

    // The music will start on the first click OR first key press anywhere on the page
    document.addEventListener("click", startAudio);
    document.addEventListener("keydown", startAudio);
    
    // Optional: Auto-resume if coming from another page
    window.addEventListener("load", () => {
        if (localStorage.getItem("musicPlaying") === "true") {
            music.play();
        }
    });

    // Save state so it stays "On" when you change pages
    music.addEventListener("play", () => localStorage.setItem("musicPlaying", "true"));
    music.addEventListener("pause", () => localStorage.setItem("musicPlaying", "false"));
</script>

</body>
